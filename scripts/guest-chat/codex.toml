model = "gpt-6-astra"
model_reasoning_effort = "high"
# Codex reserves 5%, leaving a 475K effective context window.
model_context_window = 500000
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "live"
cli_auth_credentials_store = "file"

[agents]
enabled = false
[apps._default]
enabled = false
[features]
apps = false
shell_tool = false
unified_exec = false
code_mode = true
code_mode_host = true
standalone_web_search = true
browser_use = false
computer_use = false
hooks = false
goals = false
view_image = false
skill_search = false
skill_mcp_dependency_install = false
shell_snapshot = false
image_generation = false
